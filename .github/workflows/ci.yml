name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install MTAM-HG
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit release contents
        run: python scripts/audit_release.py
      - name: Validate confirmatory protocol
        run: python run_experiment.py --dry_run
      - name: Run tests
        run: pytest -q --cov=. --cov-report=term-missing --cov-report=xml
