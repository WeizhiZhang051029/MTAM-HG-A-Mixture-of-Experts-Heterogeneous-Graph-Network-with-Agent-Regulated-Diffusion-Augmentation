[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtam-hg"
version = "1.0.0"
description = "MTAM-HG for strip yield-strength prediction with MP-TabDiff, CBTG-Agent, and MoE-IPOHGN."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Weizhi Zhang"},
    {name = "Yiteng Li"},
    {name = "Yuhan Xie"},
    {name = "Jingchuan Zhang"},
    {name = "Jianfei Pan"},
    {name = "Xinran Wang"},
    {name = "Xianpeng Wang"},
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1,<3",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pyyaml>=6,<7",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "tqdm>=4.66,<5",
    "category-encoders>=2.6,<3",
    "tomli>=2,<3",
    "tomli-w>=1,<2",
    "icecream>=2.1,<3",
    "wandb>=0.17,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools]
py-modules = [
    "config",
    "dataset",
    "evaluate",
    "config_loader",
    "protocol",
    "protocol_integrity",
    "losses",
    "pipeline",
    "metrics",
    "run_experiment",
    "train",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["generation*", "models*", "training*", "utils*"]
exclude = ["data*", "images*", "configs*", "tests*", "third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    ".venv_tabdiff",
    "outputs",
    "third_party",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
